<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{ partial "head.html" . }}
</head>
<body{{ if or .IsHome (eq .Layout "about") (and .IsSection (in (slice "posts" "projects") .Section)) (eq .Section "topics") }} class="notebook"{{ end }}>
  {{ partial "header.html" . }}
  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
